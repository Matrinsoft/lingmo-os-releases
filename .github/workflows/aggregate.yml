name: Aggregate .deb packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (leave empty for auto build+YYMMDD+HHmm)"
        required: false

permissions:
  contents: write

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            TAG="build+$(date -u +%y%m%d+%H%M)"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all .deb packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p debs
          REPOS=(
            lingmo-applets
            lingmo-applibrary
            lingmo-background
            lingmo-comp
            lingmo-config
            lingmo-edit
            lingmo-files
            lingmo-greeter
            lingmo-idle
            lingmo-icons
            lingmo-initial-setup
            lingmo-launcher
            lingmo-monitor
            lingmo-notifications
            lingmo-osd
            lingmo-panel
            lingmo-player
            lingmo-randr
            lingmo-screenshot
            lingmo-session
            lingmo-settings
            lingmo-settings-daemon
            lingmo-sound-theme
            lingmo-store
            lingmo-term
            lingmo-workspaces-epoch
            xdg-desktop-portal-lingmo
          )

          for repo in "${REPOS[@]}"; do
            echo "--- Matrinsoft/$repo ---"
            TAG=$(gh release list -R "Matrinsoft/$repo" --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)
            if [ -z "$TAG" ]; then
              echo "  SKIP: no release"
              continue
            fi
            echo "  tag: $TAG"
            gh release download "$TAG" -R "Matrinsoft/$repo" -p "*.deb" -D debs/ --clobber 2>/dev/null || echo "  WARN: no .deb assets"
          done

          echo ""
          echo "=== Downloaded ==="
          ls -lh debs/*.deb 2>/dev/null || echo "(none)"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          DEB_COUNT=$(ls debs/*.deb 2>/dev/null | wc -l)

          if [ "$DEB_COUNT" -eq 0 ]; then
            echo "ERROR: no .deb packages downloaded"
            exit 1
          fi

          gh release create "$TAG" \
            --repo "Matrinsoft/lingmo-os-releases" \
            --title "Lingmo OS $TAG" \
            --generate-notes \
            debs/*.deb
